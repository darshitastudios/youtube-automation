name: Post quiz video

on:
  schedule:
    # Twice daily — stays well inside YouTube Data API's free ~6 uploads/day quota.
    # Times are UTC (2:30 + 14:30 UTC = 8 AM + 8 PM IST).
    - cron: "30 2,14 * * *"   # 8:00 AM + 8:00 PM IST
  workflow_dispatch: {}   # "Run workflow" button in the Actions tab

permissions:
  contents: write          # to commit updated automation.db state

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Generate and upload video
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python3 daily_run.py --channel quizzydaily

      - name: Save state back to repo
        run: |
          git config user.name "quizzy-bot"
          git config user.email "quizzy-bot@users.noreply.github.com"
          git add channels/quizzydaily/automation.db
          git diff --cached --quiet || git commit -m "Update upload state"
          git push
