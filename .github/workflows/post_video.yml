name: Post quiz video

on:
  schedule:
    # 6 runs/day — matches YouTube Data API's free ~6 uploads/day quota.
    # For twice daily, use: "13 3,15 * * *"  (times are UTC)
    - cron: "13 3,15 * * *"
  workflow_dispatch: {}   # "Run workflow" button in the Actions tab

permissions:
  contents: write          # to commit updated automation.db state

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Generate and upload video
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python3 daily_run.py

      - name: Save state back to repo
        run: |
          git config user.name "quizzy-bot"
          git config user.email "quizzy-bot@users.noreply.github.com"
          git add automation.db
          git diff --cached --quiet || git commit -m "Update upload state"
          git push
