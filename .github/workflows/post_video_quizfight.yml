name: Post quiz video (Quiz Fight — Hindi)

on:
  workflow_dispatch: {}
  schedule:
    - cron: "43 6,18 * * *"   # ~12:13pm + 00:13 IST, different times than quizzydaily

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install Python deps
        run: pip install -r requirements.txt
      - name: Generate and upload video
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN_QUIZFIGHT }}
        run: python3 daily_run.py --channel quizfight
      - name: Save state back to repo
        run: |
          git config user.name "quizzy-bot"
          git config user.email "quizzy-bot@users.noreply.github.com"
          git add channels/quizfight/automation.db
          git diff --cached --quiet || git commit -m "Update upload state (quizfight)"
          git push
